<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kő-Papír-Olló Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kő-Papír-Olló</h1>
        <div class="game-area">
            <div class="choice-buttons">
                <button class="btn" id="rock">Kő</button>
                <button class="btn" id="paper">Papír</button>
                <button class="btn" id="scissors">Olló</button>
            </div>
            <div class="results">
                <p id="player-choice">A te választásod: <span></span></p>
                <p id="computer-choice">Számítógép választása: <span></span></p>
                <p id="result-message"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
